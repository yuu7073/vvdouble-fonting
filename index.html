<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>花樣符號</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="花樣符號">
<meta name="theme-color" content="#f2f1ee">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
@font-face{font-family:"Swei Fan Serif";font-weight:300;src:url(fonts/SweiFanSerif-Light.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Swei Fan Serif";font-weight:400;src:url(fonts/SweiFanSerif-Regular.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Swei Fan Serif";font-weight:700;src:url(fonts/SweiFanSerif-Bold.woff2) format("woff2");font-display:swap}

:root{--bg:#f2f1ee;--card:#fff;--ink:#1c1b19;--mute:#7a766e;--line:#e6e4df;--accent:#0f5b5b;--accent-bg:#e4f0ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
header{padding:calc(16px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:flex-end;justify-content:space-between}
header .kicker{font-size:12px;font-weight:500;color:var(--mute);letter-spacing:.08em}
header h1{margin:0;font-size:26px;font-weight:700}
.search{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tabs{display:flex;gap:8px;padding:6px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:40px;padding:0 18px;border-radius:20px;border:0;background:var(--card);font-size:15px;font-weight:500;white-space:nowrap;flex:none}
.tab.on{background:var(--ink);color:#fff}
.sec{font-size:13px;font-weight:500;color:var(--mute);margin:8px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sec .lnk{background:none;border:0;color:var(--accent);font-size:13px;font-weight:500;padding:0}
.grid{display:grid;gap:8px;margin-bottom:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.k{min-height:56px;border-radius:14px;border:2px solid transparent;background:var(--card);font-size:17px;box-shadow:0 1px 2px rgba(0,0,0,.06);padding:8px 10px;word-break:break-all;line-height:1.3;position:relative}
.g6 .k{min-height:50px;font-size:22px;padding:4px}
.row .k{min-height:44px;font-size:15px}
.line .k{width:100%;font-size:15px;min-height:46px}
.k.hit{border-color:var(--accent);background:var(--accent-bg)}
.k .fav{position:absolute;top:2px;right:4px;font-size:11px;color:#c9a227;pointer-events:none}
.empty{color:var(--mute);font-size:14px;padding:24px 0;text-align:center}
.searchbar{display:none;margin-bottom:12px}
.searchbar input,.field input,.field textarea,.field select{width:100%;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;font-family:inherit;color:var(--ink);outline:0}
.field textarea{height:auto;min-height:88px;padding:12px 14px;line-height:1.5;resize:vertical}
.field input:focus,.field textarea:focus,.searchbar input:focus{border-color:var(--ink)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--mute);margin-bottom:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;border-radius:19px;border:2px solid transparent;background:var(--card);font-size:14px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chip.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:18px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.sw .pick{position:relative;overflow:hidden;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sw .pick input{position:absolute;inset:-10px;opacity:0;width:200%;height:200%}
.rng{display:flex;align-items:center;gap:10px}
.rng input[type=range]{flex:1;accent-color:var(--accent)}
.rng span{font-size:13px;color:var(--mute);width:44px;text-align:right}
.preview{background:repeating-conic-gradient(#e9e7e2 0 25%,#f7f6f3 0 50%) 0 0/20px 20px;border-radius:16px;min-height:160px;display:flex;align-items:center;justify-content:center;padding:20px;margin-bottom:14px;overflow:hidden}
.preview canvas{max-width:100%;height:auto;display:block}
.btns{display:flex;gap:8px;margin-bottom:20px}
.btn{flex:1;height:52px;border-radius:14px;border:0;font-size:16px;font-weight:600;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn.pri{background:var(--ink);color:#fff}
.note{font-size:12px;color:var(--mute);line-height:1.6;margin:-8px 0 16px}
.add{display:flex;gap:8px;margin-bottom:16px}
.add input{flex:1}
.add button{height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--ink);color:#fff;font-size:15px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(84px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px;z-index:5}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:11px;font-weight:500;width:80px}
nav button.on{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);height:44px;padding:0 18px;border-radius:22px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transition:.2s;pointer-events:none;z-index:9;white-space:nowrap;max-width:90vw;overflow:hidden}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- 編輯器 ---- */
.ed-top{display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px}
.ed-top-r{display:flex;gap:8px}
.ic{width:44px;height:44px;border-radius:12px;border:0;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.06);color:var(--ink)}
.ic.pri{background:var(--ink);color:#fff}
.ic.sm{width:36px;height:36px;background:transparent;box-shadow:none;color:var(--mute)}
.ed-canvas{border-radius:16px;min-height:220px;max-height:46vh;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px;margin-bottom:10px}
.ed-canvas.dark{background:#2a2a2a radial-gradient(#3a3a3a 1px,transparent 1px) 0 0/14px 14px}
.ed-canvas.light{background:#f7f6f3 radial-gradient(#dcdad4 1px,transparent 1px) 0 0/14px 14px}
.ed-canvas canvas{max-width:100%;max-height:calc(46vh - 48px);width:auto;height:auto;display:block}
.ed-tools{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ed-hist{display:flex;gap:4px}
.ed-bar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ed-bar::-webkit-scrollbar{display:none}
.tb{flex:none;width:52px;height:48px;border-radius:12px;border:0;background:#e9e7e2;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600}
.tb.on{background:var(--ink);color:#fff}
.tb-group{display:flex;flex:none;border-radius:12px;overflow:hidden;gap:2px}
.tb-group .tb{border-radius:0;width:56px}
.dot{width:26px;height:26px;border-radius:13px;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.stA{font-size:14px;font-weight:700;background:#fff;color:#1c1b19;padding:1px 4px;border-radius:3px}
.tb.on .stA{background:#1c1b19;color:#fff;outline:1px solid #fff}
.ed-panel{background:var(--card);border-radius:16px;padding:14px;min-height:150px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ed-panel .pn{display:none}
.ed-panel textarea{width:100%;min-height:120px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.5;font-family:inherit;resize:vertical;outline:0;background:var(--bg)}
.ed-panel textarea:focus{border-color:var(--ink)}
.ed-panel .sec{margin-top:0}
.subtabs{display:flex;gap:14px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.st{background:none;border:0;font-size:15px;font-weight:600;color:var(--mute);padding:4px 0;white-space:nowrap}
.st.on{color:var(--ink)}
.st.imp{margin-left:auto;color:var(--accent)}
.flist{max-height:280px;overflow-y:auto}
.fi{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.fi-n{flex:1;text-align:left;background:none;border:0;padding:14px 8px;font-size:20px;color:var(--ink)}
.fi.on .fi-n{color:var(--accent)}
.fi.on .fi-n::before{content:"● ";font-size:10px;vertical-align:middle}
.fi-f{background:none;border:0;width:40px;height:40px;font-size:18px;color:#d0cdc6}
.fi-f.on{color:#c9a227}
.seg{display:flex;background:#e9e7e2;border-radius:24px;padding:4px;margin-bottom:16px}
.seg button{flex:1;height:44px;border:0;border-radius:20px;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.mA{font-size:14px;font-weight:700;padding:1px 4px;border-radius:3px}
.mA.box{background:#1c1b19;color:#fff}
.mA.stroke{-webkit-text-stroke:1px #1c1b19;color:#fff;paint-order:stroke}
.mA.shadow{text-shadow:0 2px 3px rgba(0,0,0,.35)}
.rng{margin-bottom:12px}
.rng label{font-size:13px;font-weight:500;color:var(--mute);width:60px;flex:none}
.tpls{display:flex;flex-wrap:wrap;gap:8px}
.tpl{height:46px;padding:0 6px;border:0;border-radius:12px;background:#e9e7e2;display:flex;align-items:center;font-size:15px}
.tpl span{font-weight:600}
.sheet{position:fixed;inset:0;background:var(--card);z-index:20;transform:translateY(100%);transition:.25s;display:flex;flex-direction:column;border-radius:24px 24px 0 0}
.sheet.on{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;font-size:18px}
.sheet-b{flex:1;overflow-y:auto;padding:0 20px calc(30px + env(safe-area-inset-bottom))}
.draft-add{width:100%;height:96px;border-radius:16px;border:0;background:#f2f1ee;font-size:36px;color:var(--ink);margin-bottom:24px}
.draft-h{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin-bottom:8px;font-weight:500}
.draft-h button{background:none;border:0;width:36px;height:36px}
.draft-t{width:100%;height:240px;border:0;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:20px;margin-bottom:22px;overflow:hidden}
.draft-t.dark{background:#2a2a2a radial-gradient(#3a3a3a 1px,transparent 1px) 0 0/14px 14px}
.draft-t.light{background:#f7f6f3 radial-gradient(#dcdad4 1px,transparent 1px) 0 0/14px 14px}
.draft-t img{max-width:100%;max-height:100%;object-fit:contain}
.fxk{display:flex;justify-content:space-between;align-items:center;text-align:left;font-size:18px}.fxk small{font-size:12px;color:var(--mute);flex:none;margin-left:10px}.fx-wrap .field{margin-bottom:10px}
.page{display:none}.page.on{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="kicker" id="kicker">點一下就複製</div><h1>花樣符號</h1></div>
    <button class="search" aria-label="搜尋" onclick="toggleSearch()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1c1b19" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  </header>

  <!-- 顏文字 -->
  <section class="page on" id="p-kao">
    <div class="tabs" id="kaoTabs"></div>
    <div class="searchbar" id="kaoSearch"><input placeholder="搜尋顏文字或分類" oninput="renderKao()"></div>
    <div id="kaoRecent"></div>
    <div id="kaoBody"></div>
  </section>

  <!-- 裝飾符號 -->
  <section class="page" id="p-sym">
    <div class="searchbar" id="symSearch"><input placeholder="搜尋符號" oninput="renderSym()"></div>
    <div class="fx-wrap">
      <div class="sec">英文花字 · 打字自動轉換（只支援英數）</div>
      <div class="field"><input id="fxIn" placeholder="輸入英文或數字" oninput="renderFancy()"></div>
      <div id="fxOut" class="grid line"></div>
    </div>
    <div id="symBody"></div>
  </section>

  <!-- 字型圖 -->
  <section class="page" id="p-font">
    <div class="ed">
      <div class="ed-top">
        <button class="ic" aria-label="預覽底色" onclick="ED.toggleBg()" id="bgBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg></button>
        <div class="ed-top-r">
          <button class="ic" aria-label="草稿" onclick="ED.openDrafts()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M4 4h10l6 6v10H4z"/><path d="M14 4v6h6"/></svg></button>
          <button class="ic" aria-label="儲存 / 分享" onclick="ED.share()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 17v3h16v-3"/></svg></button>
          <button class="ic pri" aria-label="複製圖片" onclick="ED.copy()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg></button>
        </div>
      </div>
      <div class="ed-canvas dark" id="edCanvas"><canvas id="cv"></canvas></div>
      <div class="ed-tools">
        <div class="ed-hist">
          <button class="ic sm" aria-label="清除" onclick="ED.clear()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M8 21L3 16l9-9 7 7-5 5zM12 7l5 5"/></svg></button>
          <button class="ic sm" aria-label="復原" onclick="ED.undo()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></svg></button>
          <button class="ic sm" aria-label="重做" onclick="ED.redo()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h4"/></svg></button>
        </div>
        <div class="ed-bar">
          <button class="tb" data-t="text" onclick="ED.tab('text')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
          <button class="tb" data-t="tpl" onclick="ED.tab('tpl')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg></button>
          <div class="tb-group">
            <button class="tb" data-t="font" onclick="ED.tab('font')">字</button>
            <button class="tb" data-t="color" onclick="ED.tab('color')"><span class="dot" id="colorDot"></span></button>
            <button class="tb" data-t="align" onclick="ED.tab('align')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M4 18h16"/></svg></button>
          </div>
          <div class="tb-group">
            <button class="tb" data-t="style" onclick="ED.tab('style')"><span class="stA">字A</span></button>
            <button class="tb" data-t="box" onclick="ED.tab('box')"><span class="dot" id="boxDot"></span></button>
          </div>
        </div>
      </div>

      <div class="ed-panel">
        <!-- 文字 -->
        <div class="pn" data-t="text"><textarea id="ftext" rows="4" placeholder="輸入文字，可換行" oninput="ED.set('text',this.value)"></textarea></div>
        <!-- 範本 -->
        <div class="pn" data-t="tpl"><div class="tpls" id="tpls"></div></div>
        <!-- 字型 -->
        <div class="pn" data-t="font">
          <div class="subtabs" id="fontTabs"></div>
          <div class="flist" id="fontList"></div>
          <input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" multiple style="display:none" onchange="ED.importFonts(this.files)">
        </div>
        <!-- 顏色 -->
        <div class="pn" data-t="color"><div class="sec">文字顏色</div><div class="sw" id="colorSw"></div></div>
        <!-- 排列 -->
        <div class="pn" data-t="align">
          <div class="sec">方向</div>
          <div class="chips" id="dirChips"><button class="chip" data-v="h" onclick="ED.set('dir','h')">橫排</button><button class="chip" data-v="v" onclick="ED.set('dir','v')">直排</button></div>
          <div class="sec">對齊</div>
          <div class="chips" id="alignChips"><button class="chip" data-v="l" onclick="ED.set('align','l')">靠左 / 靠上</button><button class="chip" data-v="c" onclick="ED.set('align','c')">置中</button><button class="chip" data-v="r" onclick="ED.set('align','r')">靠右 / 靠下</button></div>
        </div>
        <!-- 樣式 -->
        <div class="pn" data-t="style">
          <div class="subtabs"><button class="st on" onclick="ED.stab(this,'style')">樣式</button><button class="st" onclick="ED.stab(this,'adjust')">調整</button></div>
          <div class="sub" data-s="style">
            <div class="seg" id="modeSeg">
              <button data-v="none" onclick="ED.set('mode','none')" aria-label="無"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 4l16 16"/></svg></button>
              <button data-v="box" onclick="ED.set('mode','box')" aria-label="底色框"><span class="mA box">字A</span></button>
              <button data-v="stroke" onclick="ED.set('mode','stroke')" aria-label="描邊"><span class="mA stroke">字A</span></button>
              <button data-v="shadow" onclick="ED.set('mode','shadow')" aria-label="陰影"><span class="mA shadow">字A</span></button>
            </div>
            <div class="rng"><label for="r-size">字級</label><input type="range" id="r-size" min="40" max="200" oninput="ED.set('size',+this.value)"><span id="v-size"></span></div>
            <div class="rng"><label for="r-lh">行距</label><input type="range" id="r-lh" min="90" max="240" oninput="ED.set('lh',+this.value)"><span id="v-lh"></span></div>
          </div>
          <div class="sub" data-s="adjust" style="display:none">
            <div class="rng"><label for="r-ls">字距</label><input type="range" id="r-ls" min="0" max="60" oninput="ED.set('ls',+this.value)"><span id="v-ls"></span></div>
            <div class="rng"><label for="r-pad">內距</label><input type="range" id="r-pad" min="0" max="100" oninput="ED.set('pad',+this.value)"><span id="v-pad"></span></div>
            <div class="rng"><label for="r-rad">圓角</label><input type="range" id="r-rad" min="0" max="100" oninput="ED.set('rad',+this.value)"><span id="v-rad"></span></div>
            <div class="rng"><label for="r-sw">描邊粗細</label><input type="range" id="r-sw" min="2" max="30" oninput="ED.set('sw',+this.value)"><span id="v-sw"></span></div>
          </div>
        </div>
        <!-- 框色 -->

let pressTimer=null, longPressed=false;

/* ---------- 共用 ---------- */
function toast(msg){const t=document.getElementById('toast');t.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg><span>'+msg+'</span>';t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1400)}
async function copyText(s){try{await navigator.clipboard.writeText(s)}catch(e){const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function key(s, cls){const f=favs.includes(s);return `<button class="k" data-s="${esc(s)}">${esc(s)}${f?'<span class="fav">★</span>':''}</button>`}
function bindKeys(root){
  root.querySelectorAll('.k').forEach(b=>{
    const s=b.dataset.s;
    const start=e=>{longPressed=false;pressTimer=setTimeout(()=>{longPressed=true;toggleFav(s);if(navigator.vibrate)navigator.vibrate(30)},550)};
    const end=()=>clearTimeout(pressTimer);
    b.addEventListener('touchstart',start,{passive:true});b.addEventListener('touchend',end);b.addEventListener('touchmove',end);b.addEventListener('touchcancel',end);
    b.addEventListener('mousedown',start);b.addEventListener('mouseup',end);b.addEventListener('mouseleave',end);
    b.addEventListener('contextmenu',e=>e.preventDefault());
    b.addEventListener('click',async()=>{if(longPressed){longPressed=false;return}await copyText(s);b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),500);toast('已複製 '+s);pushRecent(s)});
  });
}
function pushRecent(s){recent=[s,...recent.filter(x=>x!==s)].slice(0,8);LS('recent',recent);renderRecent()}
function toggleFav(s){if(favs.includes(s)){favs=favs.filter(x=>x!==s);toast('已取消收藏')}else{favs=[s,...favs];toast('已加入收藏 ★')}LS('fav',favs);renderAll()}
function clearFav(){if(confirm('清除全部收藏？')){favs=[];LS('fav',favs);renderAll()}}
function clearCustom(){if(confirm('清除全部自訂組合？')){custom=[];LS('custom',custom);renderAll()}}
function addCustom(){const i=document.getElementById('addIn');const v=i.value.trim();if(!v)return;custom=[v,...custom.filter(x=>x!==v)];LS('custom',custom);i.value='';renderAll();toast('已加入')}
function toggleSearch(){const el=document.querySelector('#p-'+page+' .searchbar');if(!el)return;el.style.display=el.style.display==='block'?'none':'block';if(el.style.display==='block')el.querySelector('input').focus()}

/* ---------- 顏文字 ---------- */
function renderKaoTabs(){document.getElementById('kaoTabs').innerHTML=Object.keys(KAO).map(c=>`<button class="tab ${c===kaoCat?'on':''}" onclick="kaoCat='${c}';renderKaoTabs();renderKao()">${c}</button>`).join('')}
function renderRecent(){const el=document.getElementById('kaoRecent');if(!recent.length){el.innerHTML='';return}el.innerHTML=`<div class="sec">最近使用</div><div class="row">${recent.map(s=>key(s)).join('')}</div>`;bindKeys(el)}
function renderKao(){
  const q=(document.querySelector('#kaoSearch input').value||'').trim();
  const el=document.getElementById('kaoBody');
  let list, title;
  if(q){list=Object.entries(KAO).flatMap(([c,a])=>c.includes(q)?a:a.filter(s=>s.includes(q)));title=`搜尋「${esc(q)}」· ${list.length} 個`}
  else{list=KAO[kaoCat];title=`${kaoCat} · ${list.length} 個`}
  el.innerHTML=`<div class="sec">${title}</div><div class="grid g2">${list.map(s=>key(s)).join('')}</div>${list.length?'':'<div class="empty">找不到</div>'}`;bindKeys(el);
}
/* ---------- 符號 ---------- */
function renderSym(){
  const q=(document.querySelector('#symSearch input').value||'').trim();
  const el=document.getElementById('symBody');let h='';
  for(const [c,a] of Object.entries(SYM)){
    const list=q?(c.includes(q)?a:a.filter(s=>s.includes(q))):a;if(!list.length)continue;
    const line=c.includes('分隔線');
    h+=`<div class="sec">${c}</div><div class="${line?'grid line':'grid g6'}">${list.map(s=>key(s)).join('')}</div>`;
  }
  el.innerHTML=h||'<div class="empty">找不到</div>';bindKeys(el);
}

    document.querySelectorAll('#fontList .fi').forEach(b=>b.classList.toggle('on',b.dataset.id===S.font));
  }
  function sw(cols,cur,key){return cols.map(c=>`<button style="background:${c}" class="${c===cur?'on':''}" aria-label="${c}" onclick="ED.set('${key}','${c}')"></button>`).join('')+`<button class="pick" aria-label="自訂顏色"><input type="color" value="${cur}" oninput="ED.set('${key}',this.value,true)" onchange="ED.set('${key}',this.value)"></button>`}
  function renderTpls(){$('tpls').innerHTML=TPL.map((t,i)=>`<button class="tpl" onclick="ED.applyTpl(${i})"><span style="font-family:${(t.s.font?allFonts().find(x=>x.id===t.s.font):curFont()).f.replace(/"/g,'&quot;')};color:${t.s.color};${t.s.mode==='box'?`background:${t.s.box};padding:4px 10px;border-radius:${Math.min(t.s.rad||0,12)}px`:''}${t.s.mode==='stroke'?`-webkit-text-stroke:1px ${t.s.box};paint-order:stroke`:''}${t.s.mode==='shadow'?`text-shadow:0 2px 4px ${t.s.box}`:''}">${t.n}</span></button>`).join('')}
  function applyTpl(i){Object.assign(S,TPL[i].s);pushHist();syncUI();draw();toast('已套用範本')}
  function renderFonts(){
    const tabs=['全部','中文','英文','擴充','最愛'];
    $('fontTabs').innerHTML=tabs.map(t=>`<button class="st ${t===fontTab?'on':''}" onclick="ED.fontTab('${t}')">${t}</button>`).join('')+`<button class="st imp" onclick="document.getElementById('fontFile').click()">＋匯入字型</button>`;
    let list=allFonts();
    if(fontTab==='最愛')list=list.filter(x=>favFonts.includes(x.id));else if(fontTab!=='全部')list=list.filter(x=>x.g===fontTab);
    $('fontList').innerHTML=list.length?list.map(x=>`<div class="fi ${x.id===S.font?'on':''}" data-id="${x.id}"><button class="fi-n" style="font-family:${x.f.replace(/"/g,'&quot;')};font-weight:${x.w}" onclick="ED.set('font','${x.id}')">${x.n}</button><button class="fi-f ${favFonts.includes(x.id)?'on':''}" aria-label="最愛" onclick="ED.favFont('${x.id}')">★</button>${x.del?`<button class="fi-f" aria-label="刪除" onclick="ED.delFont('${x.id}')">✕</button>`:''}</div>`).join(''):`<div class="empty">${fontTab==='擴充'?'還沒有匯入字型，按上方「＋匯入字型」選 .ttf / .otf 檔':'還沒有最愛字型，按 ★ 加入'}</div>`;
  }
  function favFont(id){favFonts=favFonts.includes(id)?favFonts.filter(x=>x!==id):[...favFonts,id];LS('ed_favfonts',favFonts);renderFonts()}

  /* 繪圖 */
  function draw(){clearTimeout(drawT);drawT=setTimeout(_draw,40)}
  function hexa(hex,op){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${op/100})`}
  async function _draw(){
    const F=curFont(),size=S.size,scale=3,text=S.text||' ',lines=text.split('\n'),lh=S.lh/100,ls=S.ls;
    const fontStr=`${F.w} ${size}px ${F.f}`;
    try{await document.fonts.load(fontStr,'永A')}catch(e){}
    const cv=$('cv'),ctx=cv.getContext('2d');ctx.font=fontStr;
    const pad=S.mode==='box'?S.pad:Math.max(S.mode==='stroke'?S.sw:0,S.mode==='shadow'?size*0.15:0)+8;
    const margin=8;
    let W,H,rects=[];
    if(S.dir==='h'){
      const widths=lines.map(l=>{let w=0;for(const ch of l)w+=ctx.measureText(ch).width+ls;return Math.max(0,w-ls)});
      const maxW=Math.max(1,...widths);
      W=maxW+pad*2+margin*2;H=lines.length*size*lh+pad*2+margin*2;
      cv.width=W*scale;cv.height=H*scale;
      ctx.scale(scale,scale);ctx.font=fontStr;ctx.textBaseline='middle';
      if(S.mode==='box'){ctx.fillStyle=hexa(S.box,S.op);rr(ctx,margin,margin,W-margin*2,H-margin*2,S.rad);ctx.fill()}
      lines.forEach((l,i)=>{const y=margin+pad+size*lh*(i+0.5);let x=S.align==='c'?(W-widths[i])/2:S.align==='r'?W-margin-pad-widths[i]:margin+pad;for(const ch of l){glyph(ctx,ch,x,y,size);x+=ctx.measureText(ch).width+ls}});
    }else{
      const lens=lines.map(l=>[...l].length),maxLen=Math.max(1,...lens);
      const colW=size*lh;W=lines.length*colW+pad*2+margin*2;H=maxLen*(size+ls)-ls+pad*2+margin*2;
      cv.width=W*scale;cv.height=H*scale;
      ctx.scale(scale,scale);ctx.font=fontStr;ctx.textBaseline='middle';ctx.textAlign='center';
      if(S.mode==='box'){ctx.fillStyle=hexa(S.box,S.op);rr(ctx,margin,margin,W-margin*2,H-margin*2,S.rad);ctx.fill()}
      lines.forEach((l,i)=>{const x=W-margin-pad-colW*(i+0.5);const colH=lens[i]*(size+ls)-ls;let y=S.align==='c'?(H-colH)/2+size/2:S.align==='r'?H-margin-pad-colH+size/2:margin+pad+size/2;for(const ch of l){glyph(ctx,ch,x,y,size);y+=size+ls}});
      ctx.textAlign='start';
    }
  }
  function glyph(ctx,ch,x,y,size){
    ctx.save();
    if(S.mode==='shadow'){ctx.shadowColor=hexa(S.box,S.op);ctx.shadowBlur=size*0.12;ctx.shadowOffsetY=size*0.06}
    if(S.mode==='stroke'){ctx.lineJoin='round';ctx.lineWidth=S.sw;ctx.strokeStyle=hexa(S.box,S.op);ctx.strokeText(ch,x,y)}
    if(S.mode!=='shadow')ctx.shadowColor='transparent';
    ctx.fillStyle=S.color;ctx.fillText(ch,x,y);ctx.restore();
  }
  function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
  const blob=()=>new Promise(r=>$('cv').toBlob(r,'image/png'));
  async function copy(){await _draw();try{if(!navigator.clipboard||!window.ClipboardItem)throw 0;await navigator.clipboard.write([new ClipboardItem({'image/png':blob()})]);toast('已複製圖片，去 IG 貼上')}catch(e){toast('此瀏覽器不支援複製圖片，請用儲存')}}
  async function share(){await _draw();const b=await blob();const file=new File([b],'vvdouble-text.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vvdouble-text.png';a.click();toast('已下載圖片')}

  /* 草稿 */
  function openDrafts(){renderDrafts();$('drafts').classList.add('on')}
  function closeDrafts(){$('drafts').classList.remove('on')}
  async function saveDraft(){await _draw();const cv=$('cv'),t=document.createElement('canvas'),k=Math.min(1,640/cv.width);t.width=cv.width*k;t.height=cv.height*k;t.getContext('2d').drawImage(cv,0,0,t.width,t.height);const d=LS('ed_drafts')||[];d.unshift({id:Date.now(),date:new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}),s:JSON.parse(JSON.stringify(S)),thumb:t.toDataURL('image/png')});LS('ed_drafts',d.slice(0,40));renderDrafts();toast('已存成草稿')}
  function renderDrafts(){const d=LS('ed_drafts')||[];$('draftList').innerHTML=d.length?d.map(x=>`<div class="draft"><div class="draft-h"><span>${x.date}</span><button aria-label="刪除" onclick="ED.delDraft(${x.id})"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b5651d" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div><button class="draft-t ${previewDark?'dark':'light'}" onclick="ED.loadDraft(${x.id})"><img src="${x.thumb}" alt=""></button></div>`).join(''):'<div class="empty">還沒有草稿</div>'}
  function loadDraft(id){const x=(LS('ed_drafts')||[]).find(d=>d.id===id);if(!x)return;S=Object.assign({},DEF,x.s);pushHist();syncUI();draw();closeDrafts();toast('已載入草稿')}
  function delDraft(id){if(!confirm('刪除這份草稿？'))return;LS('ed_drafts',(LS('ed_drafts')||[]).filter(d=>d.id!==id));renderDrafts()}

  /* init */
  function init(){renderTpls();renderFonts();syncUI();tab('text');loadImported();draw()}
  return {init,set,tab,stab,undo,redo,clear,toggleBg,copy,share,draw,applyTpl,fontTab:t=>{fontTab=t;renderFonts()},favFont,delFont,importFonts,openDrafts,closeDrafts,saveDraft,loadDraft,delDraft};
})();
/* ---------- 啟動 ---------- */
renderAll();renderFancy();ED.init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
